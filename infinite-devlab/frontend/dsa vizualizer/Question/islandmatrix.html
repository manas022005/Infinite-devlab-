<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1.0" />
    <title>Number of Islands (DFS) — Infinite DevLab</title>

    <link
        href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Syne:wght@400;600;700;800&family=Bebas+Neue&display=swap"
        rel="stylesheet" />

    <script src="https://cdn.tailwindcss.com"></script>

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        theme: {
                            bg: 'var(--bg)',
                            surf: 'var(--surf)',
                            border: 'var(--border)',
                            text: 'var(--text)',
                            muted: 'var(--muted)',
                            accent: 'var(--accent)'
                        }
                    },
                    fontFamily: {
                        display: ['"Bebas Neue"', 'sans-serif'],
                        ui: ['Syne', 'sans-serif'],
                        code: ['"JetBrains Mono"', 'monospace']
                    }
                }
            }
        }
    </script>

    <style>
        :root {
            --bg: #060d0d;
            --surf: #0b1616;
            --border: #122020;
            --text: #e2e8f0;
            --muted: #4a6060;
            --accent: #2d99d4;
        }

        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: 'Syne', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
            transition: background .35s, color .35s;
        }

        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background-image:
                linear-gradient(rgba(45, 153, 212, .03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(45, 153, 212, .03) 1px, transparent 1px);
            background-size: 40px 40px;
            pointer-events: none;
            z-index: 0;
        }

        .aurora {
            position: fixed;
            top: -30%;
            left: 50%;
            transform: translateX(-50%);
            width: 900px;
            height: 600px;
            background: radial-gradient(ellipse,
                    rgba(45, 153, 212, .08) 0%,
                    transparent 70%);
            pointer-events: none;
            z-index: 0;
        }

        ::-webkit-scrollbar {
            width: 5px;
            height: 5px;
        }

        ::-webkit-scrollbar-track {
            background: var(--bg);
        }

        ::-webkit-scrollbar-thumb {
            background: var(--border);
            border-radius: 3px;
        }

        input[type=range] {
            -webkit-appearance: none;
            background: var(--border);
            outline: none;
            border-radius: 999px;
        }

        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: var(--accent);
            cursor: pointer;
        }

        .cell {
            transition: all .25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes shake {

            0%,
            100% {
                transform: translateX(0);
            }

            25% {
                transform: translateX(-4px);
            }

            75% {
                transform: translateX(4px);
            }
        }

        .hit-water {
            animation: shake 0.3s;
            opacity: 0.5;
        }
    </style>
</head>

<body class="bg-theme-bg text-theme-text font-ui min-h-screen flex flex-col relative transition-colors duration-300">

    <div class="aurora"></div>

    <div class="wrap flex-1 flex flex-col relative z-10 pt-6">

        <section class="visualizer-header px-6 py-8 border-b border-theme-border flex flex-col gap-4">

            <div>
                <p class="font-code text-[0.65rem] tracking-[0.2em] uppercase text-theme-accent mb-2">
                    Graph Algorithms · Flood Fill DFS
                </p>

                <h1 class="font-display text-5xl md:text-6xl tracking-wide leading-none text-theme-text">
                    NUMBER OF
                    <span class="text-theme-accent">ISLANDS</span>
                </h1>

                <p class="mt-2 text-theme-muted text-sm max-w-2xl leading-relaxed font-medium">
                    Given a 2D grid of '1's (land) and '0's (water),
                    count the number of islands.
                </p>
            </div>

            <div class="flex flex-wrap items-center gap-3 mt-2">

                <button id="btn-run"
                    class="font-ui text-sm font-bold px-5 py-2.5 rounded-lg bg-theme-accent text-theme-bg hover:opacity-90 transition-all">
                    ▶ Run Island Scan
                </button>

                <button id="btn-gen"
                    class="font-ui text-sm font-bold px-5 py-2.5 rounded-lg border border-theme-border bg-theme-bg hover:border-theme-accent hover:text-theme-accent transition-all">
                    ↺ Randomize Map
                </button>

                <div class="ml-auto flex items-center gap-2 font-code text-xs text-theme-muted">
                    Slow
                    <input type="range" id="spd" min="50" max="1000" value="400" step="50"
                        class="w-24 h-1 rounded-full" />
                    Fast
                </div>

            </div>
        </section>

        <div class="grid grid-cols-1 lg:grid-cols-[280px_1fr] flex-1">

            <aside class="border-r border-theme-border bg-theme-surf p-6 flex flex-col gap-6">

                <div>
                    <span class="block font-code text-[0.65rem] tracking-widest uppercase text-theme-muted mb-3">
                        Live Stats
                    </span>

                    <div class="grid grid-cols-2 gap-3 text-center">

                        <div class="bg-theme-bg border border-theme-border rounded-lg p-3">
                            <div id="s-islands" class="font-display text-3xl text-theme-accent leading-none">0</div>
                            <div class="font-code text-[0.55rem] text-theme-muted uppercase mt-1">
                                Islands Found
                            </div>
                        </div>

                        <div class="bg-theme-bg border border-theme-border rounded-lg p-3">
                            <div id="s-calls" class="font-display text-3xl text-theme-accent leading-none">0</div>
                            <div class="font-code text-[0.55rem] text-theme-muted uppercase mt-1">
                                DFS Calls
                            </div>
                        </div>

                    </div>
                </div>

                <div id="spill"
                    class="font-code text-[0.7rem] p-3 rounded-lg border border-theme-border bg-theme-bg text-theme-muted text-center font-bold uppercase tracking-wider transition-all mt-auto">
                    IDLE — Press Run
                </div>

            </aside>

            <div class="p-6 flex flex-col gap-6">

                <section
                    class="visualizer-canvas bg-theme-surf border border-theme-border rounded-xl p-8 flex flex-col items-center justify-center gap-6 relative shadow-inner min-h-[340px] overflow-hidden">

                    <div class="bg-theme-bg border border-theme-border rounded-xl p-4 shadow-lg inline-block">
                        <div id="grid-wrap" class="grid gap-1.5"></div>
                    </div>

                    <div id="result" class="text-center font-code text-sm text-theme-muted mt-2">
                        // Ready. Map loaded.
                    </div>

                </section>

            </div>
        </div>
    </div>

    <script>

        const sleep = ms => new Promise(res => setTimeout(res, ms));

        const $ = id => document.getElementById(id);

        let ROWS = 6;
        let COLS = 12;

        let gridData = [];
        let els = [];

        let spd = 400;
        let running = false;

        let islands = 0;
        let dfsCalls = 0;

        function setSpill(state, text) {

            const p = $('spill');

            p.className =
                'font-code text-[0.7rem] p-3 rounded-lg border text-center font-bold transition-all uppercase tracking-wider';

            if (state === 'run' || state === 'found') {

                p.classList.add(
                    'bg-theme-accent/10',
                    'border-theme-accent',
                    'text-theme-accent'
                );

            } else {

                p.classList.add(
                    'bg-theme-bg',
                    'border-theme-border',
                    'text-theme-muted'
                );
            }

            p.textContent = text;
        }

        function genMap() {

            if (running) return;

            gridData = [];
            els = [];

            islands = 0;
            dfsCalls = 0;

            const wrap = $('grid-wrap');

            wrap.style.gridTemplateColumns =
                `repeat(${COLS}, minmax(0, 1fr))`;

            wrap.innerHTML = '';

            for (let r = 0; r < ROWS; r++) {

                let rowData = [];
                let rowEls = [];

                for (let c = 0; c < COLS; c++) {

                    let val = Math.random() < 0.35 ? 1 : 0;

                    rowData.push(val);

                    const el = document.createElement('div');

                    el.className =
                        'cell w-10 h-10 md:w-12 md:h-12 rounded-md flex items-center justify-center font-code text-sm font-bold';

                    el.textContent = val;

                    if (val === 1) {

                        el.classList.add(
                            'bg-theme-accent/10',
                            'border-2',
                            'border-theme-accent/80',
                            'text-theme-accent'
                        );

                    } else {

                        el.classList.add(
                            'border',
                            'border-slate-700/60',
                            'text-theme-muted',
                            'opacity-50'
                        );
                    }

                    wrap.appendChild(el);

                    rowEls.push(el);
                }

                gridData.push(rowData);
                els.push(rowEls);
            }

            $('s-islands').textContent = '0';
            $('s-calls').textContent = '0';

            $('result').textContent =
                '// New matrix generated. Ready to scan.';

            setSpill('idle', 'IDLE — Press Run');
        }

        function setCellState(r, c, state) {

            const el = els[r][c];

            el.className =
                'cell w-10 h-10 md:w-12 md:h-12 rounded-md flex items-center justify-center font-code text-sm font-bold transition-all duration-300';

            if (state === 'scan') {

                el.classList.add(
                    'bg-theme-bg',
                    'border',
                    'border-theme-text',
                    'scale-110',
                    'text-theme-text'
                );

            } else if (state === 'visited') {

                el.classList.add(
                    'bg-theme-accent',
                    'text-theme-bg',
                    'scale-95'
                );

                el.textContent = '2';

            } else {

                if (gridData[r][c] === 1) {

                    el.classList.add(
                        'bg-theme-accent/10',
                        'border-2',
                        'border-theme-accent/80',
                        'text-theme-accent'
                    );

                    el.textContent = '1';

                } else if (gridData[r][c] === 2) {

                    el.classList.add(
                        'bg-theme-accent',
                        'text-theme-bg',
                        'scale-95'
                    );

                    el.textContent = '2';

                } else {

                    el.classList.add(
                        'border',
                        'border-slate-700/60',
                        'text-theme-muted',
                        'opacity-50'
                    );

                    el.textContent = '0';
                }
            }
        }

        async function runDFS(r, c) {

            dfsCalls++;

            $('s-calls').textContent = dfsCalls;

            if (
                r < 0 ||
                c < 0 ||
                r >= ROWS ||
                c >= COLS ||
                gridData[r][c] !== 1
            ) {
                return;
            }

            gridData[r][c] = 2;

            setCellState(r, c, 'visited');

            await sleep(spd);

            await runDFS(r + 1, c);
            await runDFS(r - 1, c);
            await runDFS(r, c + 1);
            await runDFS(r, c - 1);
        }

        async function runIslands() {

            if (running) return;

            running = true;

            setSpill('run', 'SCANNING MATRIX...');

            for (let r = 0; r < ROWS; r++) {

                for (let c = 0; c < COLS; c++) {

                    setCellState(r, c, 'scan');

                    await sleep(spd / 2);

                    if (gridData[r][c] === 1) {

                        islands++;

                        $('s-islands').textContent = islands;

                        $('result').textContent =
                            `// Found island at [${r}][${c}]`;

                        await runDFS(r, c);
                    }

                    setCellState(r, c, 'idle');
                }
            }

            $('result').textContent =
                `✓ Scan complete. Total Islands Found: ${islands}`;

            setSpill('found', 'COMPLETE ✓');

            running = false;
        }

        $('btn-run').onclick = runIslands;

        $('btn-gen').onclick = genMap;

        $('spd').oninput = function () {
            spd = 1100 - parseInt(this.value);
        };

        genMap();

    </script>

</body>

</html>
