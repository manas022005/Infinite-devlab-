<!DOCTYPE html>
<html lang="en" class="dark">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Codebreaker AI — Infinite DevLab</title>
  <link
    href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Bebas+Neue&family=Poppins:wght@400;500;600;700;800&display=swap"
    rel="stylesheet" />

  <style>
    :root {
      /* Infinite DevLab Theme Variables */
      --bg: #0B0F19;
      --surf: #111827;
      --surf2: #1F2937;
      --border: #1F2937;
      --border2: #374151;
      --text: #F9FAFB;
      --muted: #9CA3AF;
      --muted2: #4B5563;

      /* Primary Blues & Teals */
      --accent: #3B82F6;
      --accent2: #2563EB;
      --accentB: rgba(59, 130, 246, 0.1);
      --teal-accent: #2DD4BF;

      /* Status Colors */
      --green: #34D399;
      --greenB: rgba(52, 211, 153, 0.1);
      --orange: #FBBF24;
      --orangeB: rgba(251, 191, 36, 0.1);
      --red: #F87171;
      --redB: rgba(248, 113, 113, 0.1);
      --yellow: #FBBF24;
      --devlab-yellow: #FBBF24;

      /* Fonts */
      --F1: 'Bebas Neue', sans-serif;
      --F2: 'Poppins', sans-serif;
      --F3: 'JetBrains Mono', monospace;

      /* Layout */
      --h: 70px;
      --sw: 280px;
    }

    html.light {
      --bg: #F3F4F6;
      --surf: #FFFFFF;
      --surf2: #F9FAFB;
      --border: #E5E7EB;
      --border2: #D1D5DB;
      --text: #111827;
      --muted: #4B5563;
      --muted2: #9CA3AF;

      --accent: #2563EB;
      --accent2: #1D4ED8;
      --accentB: rgba(37, 99, 235, 0.1);
      --teal-accent: #0D9488;

      --green: #0D9488;
      --greenB: rgba(13, 148, 136, 0.1);
      --orange: #D97706;
      --orangeB: rgba(217, 119, 6, 0.1);
      --red: #DC2626;
      --redB: rgba(220, 38, 38, 0.1);
      --yellow: #D97706;
      --devlab-yellow: #D97706;
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0
    }

    html {
      scroll-behavior: smooth
    }

    body {
      font-family: var(--F2);
      background: var(--bg);
      color: var(--text);
      height: 100vh;
      overflow: hidden;
      transition: background .4s, color .4s;
    }

    /* ── SUBTLE GRADIENT BACKGROUND ── */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      z-index: -2;
      pointer-events: none;
      background: radial-gradient(circle at 50% -20%, rgba(59, 130, 246, 0.08) 0%, transparent 60%);
    }

    ::-webkit-scrollbar {
      width: 4px;
      height: 4px
    }

    ::-webkit-scrollbar-track {
      background: transparent
    }

    ::-webkit-scrollbar-thumb {
      background: var(--border2);
      border-radius: 2px
    }

    ::-webkit-scrollbar-thumb:hover {
      background: var(--accent)
    }

    /* ── KEYFRAMES ── */
    @keyframes fadeUp {
      from {
        opacity: 0;
        transform: translateY(16px)
      }

      to {
        opacity: 1;
        transform: translateY(0)
      }
    }

    @keyframes fadeIn {
      from {
        opacity: 0
      }

      to {
        opacity: 1
      }
    }

    @keyframes shimmer {
      0% {
        background-position: -400% 0
      }

      100% {
        background-position: 400% 0
      }
    }

    @keyframes spin {
      to {
        transform: rotate(360deg)
      }
    }

    @keyframes dot {

      0%,
      80%,
      100% {
        transform: scale(.55);
        opacity: .35
      }

      40% {
        transform: scale(1);
        opacity: 1
      }
    }

    @keyframes glowPulse {

      0%,
      100% {
        opacity: .6
      }

      50% {
        opacity: 1
      }
    }

    @keyframes slideRight {
      from {
        transform: translateX(-100%)
      }

      to {
        transform: translateX(0)
      }
    }

    @keyframes popIn {
      from {
        opacity: 0;
        transform: scale(.92)
      }

      to {
        opacity: 1;
        transform: scale(1)
      }
    }

    @keyframes countUp {
      from {
        opacity: 0;
        transform: translateY(8px)
      }

      to {
        opacity: 1;
        transform: translateY(0)
      }
    }

    /* ── APP SHELL ── */
    .shell {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden
    }

    /* ════════════════ GLOBAL NAVBAR ════════════════ */
    .global-nav {
      position: relative;
      /* Keeps shell layout intact */
      flex-shrink: 0;
      height: var(--h);
      background: var(--bg);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 24px;
      z-index: 1000;
    }

    .nav-left {
      display: flex;
      align-items: center;
      gap: 20px;
    }

    /* Hamburger for Codebreaker Sidebar */
    .menu-btn {
      background: none;
      border: 1px solid var(--border);
      cursor: pointer;
      color: var(--muted);
      padding: .4rem;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all .2s;
      flex-shrink: 0;
    }

    .menu-btn:hover {
      border-color: var(--accent);
      color: var(--accent);
      background: var(--surf2);
    }

    /* Logo */
    .logo-link {
      display: flex;
      align-items: center;
      gap: 8px;
      text-decoration: none;
    }

    .logo-infinite {
      font-weight: 800;
      font-size: 1.25rem;
      color: var(--text);
      letter-spacing: -0.5px;
    }

    .logo-devlab {
      font-weight: 800;
      font-size: 1.25rem;
      color: var(--devlab-yellow);
      letter-spacing: -0.5px;
    }

    /* Nav Links */
    .nav-links {
      display: flex;
      gap: 24px;
      align-items: center;
      margin-left: 10px;
    }

    .nav-links a {
      text-decoration: none;
      font-size: 0.9rem;
      font-weight: 500;
      color: var(--text);
      transition: color 0.2s;
    }

    .nav-links a:hover {
      color: var(--accent);
    }

    .nav-links a.active {
      color: var(--accent);
    }

    /* Nav Right & Auth Buttons */
    .nav-right {
      display: flex;
      gap: 16px;
      align-items: center;
    }

    .btn-login {
      background: transparent;
      color: var(--text);
      border: 1px solid var(--border);
      padding: 8px 16px;
      border-radius: 6px;
      font-size: 0.85rem;
      font-weight: 500;
      transition: 0.2s;
    }

    .btn-login:hover {
      background: var(--surf2);
    }

    .btn-register {
      background: var(--accent);
      color: #fff;
      border: none;
      padding: 8px 20px;
      border-radius: 6px;
      font-size: 0.85rem;
      font-weight: 500;
      transition: background 0.2s;
    }

    .btn-register:hover {
      background: var(--accent2);
    }

    /* Theme Toggle */
    .th-btn {
      position: relative;
      width: 44px;
      height: 24px;
      border-radius: 20px;
      border: 1px solid var(--border);
      background: var(--surf2);
      flex-shrink: 0;
      cursor: pointer;
      display: block;
      padding: 0;
      outline: none;
    }

    .th-btn .kn {
      position: absolute;
      top: 2px;
      left: 3px;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 10px;
      transition: transform 0.3s;
    }

    html.light .th-btn .kn {
      transform: translateX(18px);
      background: var(--accent);
    }

    @media (max-width: 950px) {
      .nav-links {
        display: none;
      }
    }

    @media (max-width: 600px) {

      .btn-login,
      .btn-register {
        display: none;
      }

      .global-nav {
        padding: 0 12px;
      }

      .logo-infinite,
      .logo-devlab {
        font-size: 1.1rem;
      }
    }

    /* ════════════════ BODY ════════════════ */
    .body {
      flex: 1;
      display: flex;
      overflow: hidden;
      position: relative;
      min-height: 0;
    }

    /* ════════════════ SIDEBAR ════════════════ */
    .sidebar {
      position: fixed;
      top: var(--h);
      left: 0;
      width: var(--sw);
      height: calc(100vh - var(--h));
      background: var(--surf);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      z-index: 500;
      transform: translateX(-100%);
      transition: transform .3s cubic-bezier(.4, 0, .2, 1);
      overflow: hidden;
    }

    .sidebar.open {
      transform: translateX(0)
    }

    .sb-top {
      padding: 1rem;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }

    .sb-title {
      font-family: var(--F3);
      font-size: .8rem;
      font-weight: 700;
      letter-spacing: .14em;
      text-transform: uppercase;
      color: var(--muted);
      display: flex;
      align-items: center;
      gap: .4rem;
      margin-bottom: .75rem;
    }

    .new-btn {
      width: 100%;
      padding: .55rem 1rem;
      border-radius: 8px;
      background: var(--accentB);
      border: 1px solid var(--border2);
      color: var(--accent);
      font-size: .75rem;
      font-weight: 600;
      font-family: var(--F2);
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: .4rem;
      justify-content: center;
      transition: all .2s;
    }

    .new-btn:hover {
      border-color: var(--accent);
      color: #fff;
      background: var(--accent)
    }

    .sb-list {
      flex: 1;
      overflow-y: auto;
      padding: .5rem
    }

    .sb-sec {
      font-family: var(--F3);
      font-size: .8rem;
      font-weight: 700;
      letter-spacing: .14em;
      text-transform: uppercase;
      color: var(--muted2);
      padding: .5rem .4rem .3rem;
      white-space: nowrap
    }

    .h-item {
      padding: .5rem .75rem;
      border-radius: 8px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: .45rem;
      overflow: hidden;
      transition: all .18s;
      border: 1px solid transparent;
      animation: fadeIn .3s ease forwards;
    }

    .h-item:hover {
      background: var(--surf2);
      border-color: var(--border)
    }

    .h-item.active {
      background: var(--accentB);
      border-color: var(--border2)
    }

    .h-icon {
      color: var(--muted);
      flex-shrink: 0
    }

    .h-text {
      font-family: var(--F3);
      font-size: .7rem;
      color: var(--text);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      flex: 1
    }

    .h-lang {
      font-family: var(--F3);
      font-size: .6rem;
      font-weight: 700;
      padding: .1rem .35rem;
      border-radius: 4px;
      flex-shrink: 0;
      background: var(--surf2);
      color: var(--accent);
      border: 1px solid var(--border2);
    }

    .sb-empty {
      padding: 3rem 1rem;
      text-align: center;
      font-family: var(--F3);
      font-size: .7rem;
      color: var(--muted);
      line-height: 2
    }

    .sb-empty strong {
      color: var(--accent)
    }

    /* ── SEARCH BAR ── */
    .sb-search {
      padding: .5rem 1rem .6rem;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
      background: var(--surf);
    }

    .sb-search-wrap {
      display: flex;
      align-items: center;
      gap: .5rem;
      background: var(--surf2);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: .38rem .7rem;
      transition: border-color .2s;
    }

    .sb-search-wrap:focus-within {
      border-color: var(--accent)
    }

    .sb-search-wrap svg {
      color: var(--muted);
      flex-shrink: 0
    }

    .sb-sinput {
      flex: 1;
      background: none;
      border: none;
      outline: none;
      font-family: var(--F3);
      font-size: .7rem;
      color: var(--text);
      caret-color: var(--accent);
      min-width: 0;
    }

    .sb-sinput::placeholder {
      color: var(--muted2)
    }

    /* ── RENAME INLINE ── */
    .h-item {
      position: relative
    }

    .h-rename-inp {
      flex: 1;
      background: var(--surf2);
      border: 1px solid var(--border2);
      border-radius: 5px;
      padding: .1rem .4rem;
      font-family: var(--F3);
      font-size: .7rem;
      color: var(--text);
      outline: none;
      caret-color: var(--accent);
      min-width: 0;
    }

    .h-actions {
      display: none;
      position: absolute;
      right: .4rem;
      top: 50%;
      transform: translateY(-50%);
      gap: .2rem;
      align-items: center;
      z-index: 10;
    }

    .h-item:hover .h-actions {
      display: flex
    }

    .h-act-btn {
      background: var(--surf);
      border: 1px solid var(--border);
      cursor: pointer;
      padding: .2rem;
      border-radius: 5px;
      color: var(--muted);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all .15s;
    }

    .h-act-btn:hover {
      background: var(--surf2);
      color: var(--accent)
    }

    .h-act-btn.del:hover {
      color: var(--red)
    }

    /* ════════════════ MOB TOGGLE ════════════════ */
    .mob-toggle {
      display: none;
      flex-shrink: 0;
      background: var(--surf);
      border-bottom: 1px solid var(--border)
    }

    .mob-tab {
      flex: 1;
      padding: .65rem 1rem;
      font-family: var(--F3);
      font-size: .80rem;
      font-weight: 700;
      letter-spacing: .1em;
      text-transform: uppercase;
      background: none;
      border: none;
      color: var(--muted);
      cursor: pointer;
      border-bottom: 2px solid transparent;
      transition: all .2s;
    }

    .mob-tab.active {
      color: var(--accent);
      border-bottom-color: var(--accent)
    }

    /* ════════════════ MAIN ════════════════ */
    .main-wrap {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      min-height: 0;
    }

    .main {
      flex: 1;
      display: grid;
      grid-template-columns: 1fr 1fr;
      min-height: 0;
      overflow: hidden;
    }

    /* ════════════════ LEFT PANEL ════════════════ */
    .lpanel {
      display: flex;
      flex-direction: column;
      border-right: 1px solid var(--border);
      height: 100%;
      overflow: hidden;
      background: var(--surf);
      transition: background .4s;
      position: relative;
    }

    .ph {
      padding: .7rem 1.25rem;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--bg);
      flex-shrink: 0;
    }

    .pt {
      font-family: var(--F3);
      font-weight: 700;
      font-size: .90rem;
      letter-spacing: .1em;
      text-transform: uppercase;
      color: var(--muted);
      display: flex;
      align-items: center;
      gap: .45rem;
    }

    .pt svg {
      color: var(--accent)
    }

    .lbadge {
      padding: .2rem .65rem;
      border-radius: 999px;
      font-size: .6rem;
      font-weight: 700;
      font-family: var(--F3);
      background: var(--accentB);
      color: var(--accent);
      border: 1px solid var(--border2);
    }

    .upbtn {
      display: flex;
      align-items: center;
      gap: .3rem;
      padding: .35rem .75rem;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: var(--surf);
      color: var(--muted);
      font-size: .78rem;
      font-weight: 500;
      font-family: var(--F2);
      cursor: pointer;
      white-space: nowrap;
      transition: all .2s;
    }

    .upbtn:hover {
      border-color: var(--accent);
      color: var(--accent);
      background: var(--surf2)
    }

    /* editor area */
    .editor-wrap {
      flex: 1;
      position: relative;
      overflow: hidden;
      min-height: 0;
    }

    textarea {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      background: var(--bg);
      border: none;
      outline: none;
      color: var(--text);
      font-size: .8rem;
      line-height: 1.85;
      padding: 1.1rem 1.25rem;
      resize: none;
      white-space: pre;
      overflow: auto;
      font-family: var(--F3) !important;
      transition: background .4s, color .4s;
      caret-color: var(--accent);
      -webkit-overflow-scrolling: touch;
    }

    textarea::placeholder {
      color: var(--muted2)
    }

    textarea::selection {
      background: rgba(59, 130, 246, .2);
      color: var(--text)
    }

    /* line counter strip */
    .line-nums {
      position: absolute;
      top: 0;
      left: 0;
      bottom: 0;
      width: 40px;
      background: var(--surf);
      border-right: 1px solid var(--border);
      padding: 1.1rem 0;
      overflow: hidden;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      transition: background .4s;
    }

    .ln {
      font-family: var(--F3);
      font-size: .7rem;
      color: var(--muted2);
      line-height: 1.85;
      text-align: right;
      padding-right: .5rem;
      flex-shrink: 0;
    }

    .editor-wrap.has-code textarea {
      padding-left: 55px
    }

    .cstats {
      padding: .4rem 1.25rem;
      color: var(--muted);
      font-size: .70rem;
      font-family: var(--F3);
      flex-shrink: 0;
      letter-spacing: .04em;
      display: flex;
      align-items: center;
      gap: 1rem;
      border-top: 1px solid var(--border);
      background: var(--surf);
    }

    .cstat-chip {
      display: flex;
      align-items: center;
      gap: .25rem
    }

    /* ── ANALYZE BUTTON ── */
    .abtn-wrap {
      padding: .875rem 1.25rem;
      flex-shrink: 0;
      background: var(--surf);
      position: relative;
      z-index: 10;
    }

    .abtn {
      width: 100%;
      padding: .85rem;
      background: linear-gradient(135deg, rgb(43, 43, 203) 0%, rgb(137, 137, 235) 100%);
      border: none;
      border-radius: 8px;
      color: #fff;
      font-family: var(--F2);
      font-weight: 600;
      font-size: .95rem;
      letter-spacing: .04em;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: .6rem;
      transition: all .25s;
      position: relative;
      overflow: hidden;
    }

    .abtn::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, var(--teal-accent) 0%, var(--accent) 100%);
      opacity: 0;
      transition: opacity .3s;
    }

    .abtn:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 10px 30px rgba(59, 130, 246, 0.3)
    }

    .abtn:hover:not(:disabled)::before {
      opacity: 1
    }

    .abtn:disabled {
      opacity: .5;
      cursor: not-allowed;
      transform: none;
      box-shadow: none;
    }

    .abtn-inner {
      position: relative;
      z-index: 1;
      display: flex;
      align-items: center;
      gap: .6rem
    }

    /* ════════════════ RIGHT PANEL ════════════════ */
    .rpanel {
      display: flex;
      flex-direction: column;
      background: var(--bg);
      height: 100%;
      overflow: hidden;
      min-height: 0;
    }

    /* tabs */
    .tabs {
      display: flex;
      border-bottom: 1px solid var(--border);
      background: var(--surf);
      flex-shrink: 0;
      z-index: 10;
      overflow-x: auto;
      overflow-y: hidden;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
    }

    .tabs::-webkit-scrollbar {
      display: none
    }

    .tab {
      flex-shrink: 0;
      padding: .85rem 1rem;
      font-size: .75rem;
      font-weight: 600;
      font-family: var(--F3);
      letter-spacing: .05em;
      text-transform: uppercase;
      cursor: pointer;
      white-space: nowrap;
      border: none;
      background: none;
      color: var(--muted);
      border-bottom: 2px solid transparent;
      display: flex;
      align-items: center;
      gap: .3rem;
      transition: all .2s;
      position: relative;
    }

    .tab::after {
      content: '';
      position: absolute;
      bottom: -1px;
      left: 50%;
      right: 50%;
      height: 2px;
      background: var(--accent);
      transition: all .25s;
      border-radius: 2px
    }

    .tab.active {
      color: var(--text);
      background: var(--surf2);
    }

    .tab.active::after {
      left: 0;
      right: 0
    }

    .tab:hover:not(.active) {
      color: var(--text);
      background: var(--surf2)
    }

    .badge {
      border-radius: 999px;
      padding: .1rem .35rem;
      font-size: .55rem;
      font-weight: 700;
      line-height: 1.5;
      animation: popIn .3s ease;
    }

    .lbar {
      height: 2px;
      background: linear-gradient(90deg, transparent, var(--accent), var(--teal-accent), transparent);
      background-size: 300% 100%;
      animation: shimmer 1.5s infinite;
      flex-shrink: 0;
      display: none
    }

    .rc {
      flex: 1;
      overflow-y: auto;
      padding: 1.25rem;
      min-height: 0;
      -webkit-overflow-scrolling: touch;
    }

    /* placeholder */
    .ph-box {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      gap: .85rem;
      text-align: center
    }

    .ph-ico {
      width: 64px;
      height: 64px;
      border-radius: 16px;
      background: var(--surf2);
      border: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      animation: glowPulse 3s ease infinite;
    }

    .ph-title {
      font-family: var(--F1);
      font-size: 1.5rem;
      letter-spacing: .04em;
      color: var(--text)
    }

    .ph-sub {
      font-family: var(--F2);
      font-size: .85rem;
      max-width: 260px;
      line-height: 1.6;
      color: var(--muted)
    }

    /* ── CARDS ── */
    .card {
      background: var(--surf);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 1rem 1.1rem;
      margin-bottom: .875rem;
      animation: fadeUp .35s ease forwards;
      transition: border-color .2s, background .4s;
      position: relative;
      overflow: hidden;
    }

    .card-title {
      font-family: var(--F1);
      font-size: 1.1rem;
      letter-spacing: .04em;
      margin-bottom: .75rem;
      display: flex;
      align-items: center;
      gap: .45rem;
      color: var(--text);
    }

    /* score ring */
    .score-wrap {
      display: flex;
      align-items: center;
      gap: 1.25rem
    }

    .sring {
      width: 76px;
      height: 76px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      flex-shrink: 0;
      position: relative;
    }

    .sring svg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      transform: rotate(-90deg)
    }

    .sring-bg {
      fill: none;
      stroke: var(--border);
      stroke-width: 4
    }

    .sring-fg {
      fill: none;
      stroke-width: 4;
      stroke-linecap: round;
      transition: stroke-dashoffset 1.2s cubic-bezier(.4, 0, .2, 1)
    }

    .snum {
      font-family: var(--F1);
      font-size: 1.5rem;
      letter-spacing: .03em;
      line-height: 1;
      position: relative;
      z-index: 1;
      animation: countUp .5s ease .3s both
    }

    .slbl {
      font-family: var(--F3);
      font-size: .46rem;
      letter-spacing: .12em;
      color: var(--muted);
      position: relative;
      z-index: 1
    }

    /* tags */
    .tag {
      display: inline-flex;
      align-items: center;
      padding: .2rem .6rem;
      border-radius: 4px;
      font-size: .65rem;
      font-weight: 600;
      font-family: var(--F3);
      margin: .18rem;
      border: 1px solid;
      transition: all .15s;
      cursor: default;
    }

    .tag:hover {
      transform: translateY(-1px)
    }

    .ta {
      background: var(--accentB);
      color: var(--accent);
      border-color: var(--border2)
    }

    .to {
      background: var(--orangeB);
      color: var(--orange);
      border-color: var(--border)
    }

    /* items */
    .wi {
      display: flex;
      align-items: flex-start;
      gap: .65rem;
      padding: .75rem 1rem;
      border-radius: 8px;
      margin-bottom: .5rem;
      font-size: .8rem;
      line-height: 1.65;
      transition: transform .15s;
      animation: fadeUp .3s ease forwards;
    }

    .wi:hover {
      transform: translateX(3px)
    }

    .wi-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      flex-shrink: 0;
      margin-top: 6px
    }

    .qi {
      padding: .75rem 1rem;
      border-radius: 8px;
      margin-bottom: .5rem;
      background: var(--surf2);
      border: 1px solid var(--border);
      font-size: .8rem;
      line-height: 1.65;
      cursor: pointer;
      transition: all .2s;
      animation: fadeUp .3s ease forwards;
      display: flex;
      align-items: flex-start;
      gap: .5rem;
    }

    .qi:hover {
      border-color: var(--accent);
      background: var(--accentB);
      transform: translateX(3px)
    }

    .qi-num {
      font-family: var(--F3);
      font-size: .65rem;
      font-weight: 700;
      color: var(--accent);
      flex-shrink: 0;
      background: var(--surf);
      border: 1px solid var(--border2);
      padding: .15rem .4rem;
      border-radius: 4px;
      margin-top: 2px;
    }

    .prose {
      font-size: .85rem;
      line-height: 1.8;
      color: var(--text);
      white-space: pre-wrap
    }

    .bpi {
      display: flex;
      align-items: flex-start;
      gap: .55rem;
      padding: .6rem .85rem;
      border-radius: 6px;
      margin-bottom: .45rem;
      background: var(--surf2);
      border: 1px solid var(--border);
      font-size: .8rem;
      line-height: 1.65;
      animation: slideRight .3s ease forwards;
      transition: transform .15s;
    }

    .bpi:hover {
      transform: translateX(3px);
      border-color: var(--green)
    }

    .spinner {
      width: 20px;
      height: 20px;
      border: 2px solid var(--border2);
      border-top: 2px solid var(--accent);
      border-radius: 50%;
      animation: spin .7s linear infinite
    }

    /* ════════════════ CHAT ════════════════ */
    .chat-wrap {
      display: none;
      flex-direction: column;
      height: 100%;
      overflow: hidden;
      min-height: 0;
      flex: 1;
    }

    .chat-msgs {
      flex: 1;
      overflow-y: auto;
      padding: 1.25rem;
      min-height: 0;
      display: flex;
      flex-direction: column;
      gap: .65rem;
      -webkit-overflow-scrolling: touch;
    }

    .bmsg {
      animation: fadeUp .28s ease forwards
    }

    .buser {
      align-self: flex-end;
      background: var(--accent);
      color: #fff;
      border-radius: 14px 14px 2px 14px;
      padding: .7rem .95rem;
      font-size: .85rem;
      line-height: 1.7;
      max-width: 82%;
      font-family: var(--F2);
    }

    .bai {
      align-self: flex-start;
      background: var(--surf2);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 2px 14px 14px 14px;
      padding: .7rem .95rem;
      font-size: .85rem;
      line-height: 1.7;
      max-width: 94%;
    }

    .attach-chip {
      align-self: flex-end;
      margin-bottom: .2rem;
      display: inline-flex;
      align-items: center;
      gap: .3rem;
      padding: .22rem .6rem;
      border-radius: 6px;
      background: var(--surf2);
      border: 1px solid var(--border);
      font-size: .6rem;
      font-family: var(--F3);
      color: var(--accent);
    }

    .chat-att {
      padding: .45rem 1rem 0;
      background: var(--surf);
      border-top: 1px solid var(--border);
      flex-shrink: 0;
      display: none;
    }

    .att-chip {
      display: inline-flex;
      align-items: center;
      gap: .45rem;
      padding: .32rem .7rem;
      border-radius: 6px;
      background: var(--surf2);
      border: 1px solid var(--border);
      font-size: .75rem;
      font-family: var(--F2);
    }

    /* ── CHAT INPUT ROW ── */
    .irow {
      display: flex;
      gap: .5rem;
      padding: .8rem 1rem;
      border-top: 1px solid var(--border);
      background: var(--surf);
      align-items: center;
      flex-shrink: 0;
      position: relative;
      z-index: 10;
      width: 100%;
    }

    .chat-in {
      flex: 1;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: .7rem 1rem;
      color: var(--text);
      font-size: .85rem;
      outline: none;
      font-family: var(--F2);
      transition: all .2s;
      caret-color: var(--accent);
      min-width: 0;
      max-width: 100%;
    }

    .chat-in:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(59, 130, 246, .15)
    }

    .sbtn {
      padding: .7rem 1rem;
      background: var(--accent);
      border: none;
      border-radius: 8px;
      color: #fff;
      font-weight: 600;
      cursor: pointer;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all .2s;
    }

    .sbtn:hover {
      background: var(--accent2);
      transform: translateY(-1px);
    }

    .tdots {
      display: flex;
      gap: .3rem;
      align-items: center;
      padding: .25rem 0
    }

    .tdots div {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--accent)
    }

    .tdots div:nth-child(1) {
      animation: dot 1.3s infinite 0s
    }

    .tdots div:nth-child(2) {
      animation: dot 1.3s infinite .2s
    }

    .tdots div:nth-child(3) {
      animation: dot 1.3s infinite .4s
    }

    /* ════════════════ MARKDOWN & CODE ════════════════ */
    .fmt p {
      margin-bottom: .6rem;
      line-height: 1.8;
      font-size: .85rem;
      color: var(--text)
    }

    .fmt ul,
    .fmt ol {
      margin: .35rem 0 .7rem 1.2rem
    }

    .fmt li {
      margin-bottom: .3rem;
      font-size: .85rem;
      line-height: 1.65;
      color: var(--text)
    }

    .fmt strong {
      color: var(--accent);
      font-weight: 600
    }

    .fmt em {
      font-style: italic;
      color: var(--muted)
    }

    .fmt code {
      background: var(--bg);
      padding: .1rem .4rem;
      border-radius: 4px;
      font-family: var(--F3);
      font-size: .75rem;
      color: var(--teal-accent);
      border: 1px solid var(--border)
    }

    .fmt h3 {
      font-family: var(--F1);
      font-size: 1.1rem;
      color: var(--accent);
      margin: .85rem 0 .35rem;
      letter-spacing: .04em
    }

    .fmt h2 {
      font-family: var(--F1);
      font-size: 1.3rem;
      color: var(--text);
      margin: .95rem 0 .45rem
    }

    .cblk {
      background: #05080f;
      border: 1px solid var(--border);
      border-radius: 8px;
      margin: .6rem 0 .9rem;
      overflow: hidden;
      position: relative
    }

    .chdr {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: .45rem .9rem;
      background: var(--surf2);
      border-bottom: 1px solid var(--border)
    }

    .clng {
      font-family: var(--F3);
      font-size: .65rem;
      font-weight: 700;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: .08em;
      display: flex;
      align-items: center;
      gap: .4rem
    }

    .ccpy {
      background: none;
      border: 1px solid var(--border);
      border-radius: 4px;
      color: var(--text);
      font-size: .65rem;
      padding: .2rem .6rem;
      cursor: pointer;
      font-family: var(--F3);
      transition: all .2s;
    }

    .ccpy:hover {
      color: var(--accent);
      border-color: var(--accent);
      background: var(--surf)
    }

    .ccnt {
      padding: .9rem 1rem;
      overflow-x: auto;
      font-family: var(--F3);
      font-size: .75rem;
      line-height: 1.75;
      color: #E5E7EB;
      white-space: pre
    }

    /* ════════════════ RESPONSIVE ════════════════ */
    @media(max-width:900px) {
      .main {
        grid-template-columns: 1fr;
        grid-template-rows: 1fr;
        height: 100%;
      }

      .lpanel,
      .rpanel {
        grid-column: 1;
        grid-row: 1;
        height: 100%;
        border-right: none;
        width: 100%;
        display: flex;
        flex-direction: column;
        overflow: hidden;
        min-height: 0;
      }

      .lpanel.hidden,
      .rpanel.hidden {
        display: none
      }

      .mob-toggle {
        display: flex
      }

      .rpanel {
        display: flex;
        flex-direction: column;
      }

      .rc {
        flex: 1;
        min-height: 0;
        overflow-y: auto;
      }

      .chat-wrap {
        flex: 1;
        min-height: 0;
        overflow: hidden;
      }

      .irow {
        flex-shrink: 0 !important;
        min-height: 56px;
        padding: .7rem .875rem;
        padding-bottom: max(.7rem, env(safe-area-inset-bottom));
      }

      .abtn-wrap {
        flex-shrink: 0 !important;
        padding: .7rem .875rem;
        padding-bottom: max(.7rem, env(safe-area-inset-bottom));
        background: var(--surf);
        border-top: 1px solid var(--border);
      }
    }

    @media(max-width:600px) {
      .ph {
        padding: .6rem 1rem
      }

      textarea {
        padding: .9rem 1rem;
        font-size: .8rem
      }

      .cstats {
        padding: .4rem 1rem
      }

      .abtn-wrap {
        padding: .6rem .875rem
      }

      .abtn {
        padding: .75rem;
        font-size: .9rem
      }

      .rc,
      .chat-msgs {
        padding: .875rem
      }

      .irow {
        padding: .6rem .75rem;
        gap: .4rem
      }

      .irow .upbtn {
        padding: .6rem
      }

      .sbtn {
        padding: .65rem .8rem
      }

      .chat-in {
        font-size: .8rem;
        padding: .65rem .8rem;
        min-width: 0;
        flex: 1;
      }
    }

    @media(max-width:380px) {
      .abtn-wrap {
        padding: .5rem .75rem
      }

      .abtn {
        padding: .7rem;
        font-size: .85rem
      }

      .irow {
        padding: .5rem .6rem;
        gap: .3rem
      }

      .irow .upbtn {
        display: none
      }

      .chat-in {
        font-size: .8rem;
        padding: .6rem .7rem
      }
    }

    @supports (height: 100dvh) {
      body {
        height: 100dvh;
      }

      .shell {
        height: 100dvh;
      }

      .sidebar {
        height: calc(100dvh - var(--h));
      }
    }

    @supports not (height: 100dvh) {
      @supports (-webkit-touch-callout: none) {
        body {
          height: -webkit-fill-available;
        }

        .shell {
          height: -webkit-fill-available;
        }
      }
    }

    .abtn-wrap {
      padding-bottom: max(.875rem, env(safe-area-inset-bottom));
    }

    .irow {
      padding-bottom: max(.8rem, env(safe-area-inset-bottom));
    }
  </style>
</head>
